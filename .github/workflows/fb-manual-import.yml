name: Import Facebook photos (one time)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fb-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Download photos and update products.json
        run: python scripts/fb_manual_import.py
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add products.json images/products
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "amyscloset-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Import photos from Amy's Closet Facebook page"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
